<!DOCTYPE html>
<html>
<head>
  <title>CarZen – Pay with Razorpay</title>
  <!-- 1️⃣ Load the Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    body { font-family: Arial, sans-serif; max-width: 460px; margin: 40px auto; }
    button { width: 100%; padding: 12px; background:#0c6cf2; color:#fff; border:none; cursor:pointer; }
    #msg { margin-top: 20px; }
  </style>
</head>
<body>

<h2>Pay for Service Request #3</h2>
<button id="payBtn">Pay ₹2 500.00</button>
<div id="msg"></div>

<script>
  const SERVICE_ID = 3;                     // <-- the service‑request you are paying for
  const BACKEND = "http://127.0.0.1:8000/v1";   // change to your real host

  // -------------------------------------------------------------------------
  // 2️⃣ Ask the backend for a Razorpay order (public data only)
  async function getOrderInfo() {
    const resp = await fetch(`${BACKEND}/service-requests/${SERVICE_ID}/pay-online`, {
      method: "POST"
    });
    if (!resp.ok) throw new Error("Failed to start payment");
    const data = await resp.json();
    // Convert rupees → paise as Razorpay expects
    data.amount = data.amount * 100;
    return data;
  }

  // -------------------------------------------------------------------------
  // 3️⃣ Open Razorpay Checkout UI
  async function openCheckout() {
    try {
      const order = await getOrderInfo();

      const options = {
        key:          order.key_id,               // public key from backend
        amount:       order.amount,               // in paise
        currency:     "INR",
        name:         "CarZen",
        description:  `Service Request #${SERVICE_ID}`,
        order_id:     order.razorpay_order_id,   // from backend
        handler: async function (response) {
          // 4️⃣ Payment succeeded – send data to verify endpoint
          const verifyResp = await fetch(
            `${BACKEND}/service-requests/${SERVICE_ID}/verify-online`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_order_id:   response.razorpay_order_id,
                razorpay_signature:  response.razorpay_signature
              })
            }
          );

          const result = await verifyResp.json();
          if (verifyResp.ok && result.status === "SUCCESS") {
            document.getElementById("msg").innerHTML = "✅ Payment verified!";
          } else {
            document.getElementById("msg").innerHTML = "⚠️ Verification failed.";
          }
        },
        prefill: {
          name:   "John Buyer",
          email:  "buyer@carzen.com",
          contact:"9999999999"
        },
        theme: { color: "#0c6cf2" }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    } catch (e) {
      document.getElementById("msg").innerHTML = "❌ " + e.message;
    }
  }

  // -------------------------------------------------------------------------
  // Bind the button
  document.getElementById("payBtn").addEventListener("click", openCheckout);
</script>

</body>
</html>
